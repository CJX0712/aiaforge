[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaforge"
version = "0.1.0"
description = "World-class attribute inference attack system (AiaFuse flagship): calibrate-fused, regime-routed inference of sensitive attributes from model outputs. Author 晨星."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
keywords = ["privacy", "attribute-inference", "model-leakage", "adversarial", "machine-learning", "security"]
dependencies = ["numpy>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiaforge*", "core*", "data*", "aia*", "eval*", "pipeline*", "cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-W ignore::UserWarning -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "RUF", "PLW", "B"]
ignore = ["PLW1510", "B008", "RUF015"]

[tool.ruff.format]
quote-style = "double"
